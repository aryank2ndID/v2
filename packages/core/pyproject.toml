[project]
name = "oa-core"
version = "0.1.0"
description = "SIH26004 - shared domain logic for portable OA risk screening"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "numpy>=1.26", "scikit-learn>=1.4", "joblib>=1.3"]

[project.optional-dependencies]
onnx = ["skl2onnx>=1.16", "onnxruntime>=1.17"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oa_core*"]

[tool.setuptools.package-data]
oa_core = ["locales/*.json"]
